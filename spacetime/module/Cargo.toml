[package]
name = "dispatch-spacetime-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "SpacetimeDB module holding dispatch's shared domain"

# Deliberately NOT a member of the dispatch workspace (see the root
# Cargo.toml's `exclude`). It compiles to wasm32-unknown-unknown through
# `spacetime build`, needs a newer minimum Rust than CI pins, and is not linked
# into the dispatch binary. Keeping it out means a plain `cargo test` at the
# repo root is unaffected by it.

# Its OWN workspace root, standing alone. The dispatch root excludes this
# directory, which stops cargo binding it there but does not stop cargo
# walking further up — and in a git worktree under `.worktrees/` the next
# Cargo.toml up is the PARENT checkout's workspace, which excludes nothing.
# Without this table every command run from inside this directory fails with
# "current package believes it's in a workspace when it's not", including the
# `cargo check --target wasm32-unknown-unknown` that CLAUDE.md tells you to run.
[workspace]

[lib]
# `rlib` alongside `cdylib` so `cargo test` has something to link a test
# harness against. `spacetime build` takes the cdylib and ignores the rest.
crate-type = ["cdylib", "rlib"]

[dependencies]
spacetimedb = "2.10"
