#!/usr/bin/env bash
# bots.conf — bot author logins. TWO scripts read this one list, so a
# deployment spells its bots once:
#
#   - fetch-reviews.sh's bot-author pass emits every open PR authored by one of
#     these bots in one of repos.conf's REPOS, whether or not you are a
#     requested reviewer on it. Those PRs route to the Bots sub-epic. Without
#     this file, a Renovate or Dependabot PR only reaches Bots when you happen
#     to be a requested reviewer — which for dependency-update PRs is the
#     exception, not the rule.
#   - fetch-dependabot.sh runs one `gh pr list --author` pass per login.
#
# fetch-reviews.sh reads the list a SECOND time, for a different purpose: a PR
# it emits gets tag "dependabot" only when its author is on this list, and tag
# "pr-review" otherwise. That is what keeps a release bot (release-please and
# its kin, authoring "chore(master): release 8.21.10") out of the dependency
# review runbook — its login ends in "[bot]" like any other, but it authored
# something the runbook cannot classify. So DO NOT list a release bot here.
#
# THE EMPTY LIST MEANS THREE DIFFERENT THINGS. fetch-reviews.sh skips its
# bot-author pass entirely; its TAGGING falls back to the "[bot]" login suffix,
# because narrowing is only sound once a deployment has said which of its bots
# are dependency bots; and fetch-dependabot.sh falls back to app/kognic-renovate,
# because an installed copy of that script predates this file and must keep
# emitting what it emitted before. So leaving BOT_AUTHORS empty — the shipped
# state — is not "no bots" for any of the three.
#
# Scope is repos.conf's REPOS only: it is deliberately never run org-scoped
# (unlike the review queries in org.conf), because org-wide bot authorship
# sweeps in every dependency-update PR in the org.
#
# Use gh search's app form, "app/<slug>". The slug is deployment-specific: a
# self-hosted Renovate app is named after the org that installed it, so it is
# app/kognic-renovate, NOT app/renovate. Check yours with:
#
#   gh pr list --repo owner/repo --state open --json author
#
# Add "app/<slug>" entries, one per line:
#
# BOT_AUTHORS=(
#   "app/my-org-renovate"
#   "app/dependabot"
# )
BOT_AUTHORS=()
