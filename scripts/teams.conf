#!/usr/bin/env bash
# teams.conf — GitHub team list for fetch-reviews.sh's team-scoped pass.
#
# Team Reviews holds exactly the open PRs that ask one of these teams for
# review, in any repo of the team's org. It is the ONLY source of Team
# Reviews: with no teams listed, Team Reviews stays empty. A request naming
# you personally still goes to My Reviews, whatever this file says.
#
# Each entry is "<org>/<team-slug>" — the slug from the team's URL,
# github.com/orgs/<org>/teams/<team-slug>. A misspelt team makes GitHub
# reject the search; fetch-reviews.sh reports it on stderr.
#
# TEAMS=(
#   "myorg/backend-team"
#   "myorg/platform"
# )
TEAMS=()
