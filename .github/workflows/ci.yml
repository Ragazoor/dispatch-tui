name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      # `~/.cache/ort.pyke.io` must be cached together with `target`. fastembed
      # pulls ort-sys, whose build script downloads ONNX Runtime into that
      # directory and then emits an absolute `-L` pointing at it. That `-L` is
      # recorded in `target/**/build/ort-sys-*/output`, and cargo replays the
      # recorded output instead of re-running the script (registry sources never
      # change, so its fingerprint stays fresh). Caching `target` alone therefore
      # restores an `-L` to a directory that does not exist on a fresh runner,
      # and rustc fails the moment it rebuilds the ort-sys lib with
      # "could not find native static library `onnxruntime`". Both paths live in
      # one cache entry, so they are saved and restored together and cannot drift.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      # The tests/tmux_*.rs targets (split_hook, lifecycle, window_targets) drive
      # a real tmux server (each on its own private socket) because the mock
      # layer cannot observe which pane tmux delivers keystrokes to, which cwd a
      # pane resolves, or how many panes a window ends up with. Without tmux those
      # tests skip, so install it explicitly rather than relying on whatever the
      # runner image happens to ship. They fail rather than skip when CI is set,
      # so dropping this step cannot quietly turn them into a no-op.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      # See the Test job's cache step for why ~/.cache/ort.pyke.io is here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      # See the Test job's cache step for why ~/.cache/ort.pyke.io is here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      # Same reason as the test job: tarpaulin runs the suite, and without tmux
      # the real-tmux tests (the tests/tmux_*.rs targets) skip, understating
      # coverage.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # One tarpaulin run, two outputs. This used to be two invocations — one
      # for the XML artifact, a second `--skip-clean` pass purely to print the
      # summary — and each invocation re-runs the entire test suite, so the job
      # paid for the suite twice to render the same numbers in a second format.
      #
      # `--fail-under` is what makes this job a gate rather than a report. The
      # floor sits below the measured figure on purpose (90.28% when it was set,
      # 2026-08-16): it catches a regression that drops a couple of points, not
      # the normal drift of a single file. Raise it deliberately, never
      # automatically to whatever today's run happens to score.
      #
      # `--engine llvm` is pinned because the floor is calibrated against it.
      # The default (`Auto`) engine measured 88.54% on the same tree the llvm
      # engine scored 90.28% — a ~1.8-point difference in instrumentation, not
      # in the code. Leaving the engine to the default would leave a floor of 88
      # half a point of slack and fail on noise.
      - name: Run coverage
        run: cargo tarpaulin --engine llvm --target x86_64-unknown-linux-gnu --out xml --out stdout --output-dir coverage/ --fail-under 88

      # `if: always()` so the report still uploads when the floor trips — that is
      # exactly the run whose per-file numbers someone needs to read.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # The same gate scripts, in the same order, as `.githooks/pre-push`. The hook
  # is inert until a clone runs `git config core.hooksPath .githooks` and any
  # push can bypass it with `--no-verify`, so CI is the only place these are
  # guaranteed to run. `tests/ci_gates.rs` asserts the two lists stay in sync:
  # a script added to the hook fails that test until it is added here too.
  #
  # Every one of these is a shell script over the checkout — no toolchain, no
  # cargo cache — so they share a single runner rather than a job each.
  gates:
    name: Gate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate path references in docs
        run: ./scripts/check-doc-paths.sh

      - name: Self-test the doc-path checker
        run: bash ./scripts/test-check-doc-paths.sh

      - name: Validate symbol citations in docs
        run: ./scripts/check-doc-symbols.sh

      - name: Self-test the doc-symbol checker
        run: bash ./scripts/test-check-doc-symbols.sh

      - name: Validate quoted heading citations in docs
        run: ./scripts/check-doc-headings.sh

      - name: Self-test the doc-heading checker
        run: bash ./scripts/test-check-doc-headings.sh

      - name: Reject wall-clock waits in test code
        run: ./scripts/check-no-test-sleep.sh

      - name: Self-test the no-test-sleep checker
        run: bash ./scripts/test-check-no-test-sleep.sh

      # fetch-reviews.sh feeds the review board; its self-test drives it against
      # a stub `gh`, so it needs no network and no credentials.
      - name: Self-test the fetch-reviews feed script
        run: bash ./scripts/test-fetch-reviews.sh

      # Both feed scripts that read bots.conf reject a BOT_AUTHORS entry not in
      # gh's app form. Same stub-`gh` approach: no network, no credentials.
      - name: Self-test the bots.conf validation
        run: bash ./scripts/test-bots-conf.sh
