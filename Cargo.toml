[package]
name = "dispatch-tui"
version = "0.2.0"
edition = "2021"
description = "A terminal kanban board for dispatching and managing AI agents"
license = "MIT"
repository = "https://github.com/Ragazoor/dispatch-tui"
readme = "README.md"
keywords = ["tui", "kanban", "claude", "ai-agents", "tmux"]
categories = ["command-line-utilities", "development-tools"]

# The SpacetimeDB module under `spacetime/module` is a package inside this
# directory tree, so cargo would otherwise refuse to build here ("package is a
# member of no workspace"). It is excluded rather than made a member: it targets
# wasm32, is built by `spacetime build`, and a plain `cargo build`/release
# binary links none of it — only `test-support` (`cargo test`) does, to reuse
# its pure helpers in `MemoryReducerCaller`. See spacetime/module/README.md.
[workspace]
exclude = ["spacetime/module"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal"] }
regex = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# Client side of the hook delivery in `src/hooks/` (see `HookDelivery` in
# docs/specs/agent-health.allium). All three are already in the build tree as
# axum's own dependencies, so naming them directly adds no new leaf to the
# dependency graph — the same argument `hmac-sha256` above is here on.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Blocking GET of the store database identity, http:// and https:// alike
# (store_pin.rs). Already in the build through hf-hub, with rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
include_dir = "0.7"
# Digest for the shipped-feed-script provenance manifest (see
# `InstallShippedFeedScripts` in docs/specs/feeds.allium). Already in the build
# tree as a transitive dependency of ort-sys, and itself dependency-free, so
# naming it directly adds no new leaf to the dependency graph.
hmac-sha256 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tui-tree-widget = "0.23"
# Task #4447: `default-features = false` drops two-thirds of the build tree, so
# keep it off when bumping the major — re-enabling defaults silently restores both:
#   - `image-models`: we only ever construct a `TextEmbedding`
#     (`src/service/embeddings.rs`), so the `image` crate and its encoder subtree
#     (ravif/rav1e/…) is pure build-time weight.
#   - `hf-hub-native-tls`: hf-hub's `native-tls` hard-enables `dep:reqwest`, which
#     the model download never uses — it goes over `ureq`. The rustls variants
#     below leave `reqwest` optional and unselected.
# Consequence of rustls: the one-time model/ort download trusts bundled
# `webpki-roots`, not the OS trust store, so an OS-installed corporate CA is
# ignored. `cargo test` cannot catch a regression here — every test builds the
# `new_noop` stub, so the real download path is only exercised by running the app.
fastembed = { version = "5", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
spacetimedb-sdk = "2.10.1"
# `MemoryReducerCaller` (src/sync/memory_caller.rs) reuses this crate's pure,
# ctx-free helpers (derive_epic_status, apply_task_patch, stamps_completion,
# validate_task_ownership) rather than re-deriving their logic natively — see
# docs/specs/spacetime-memory-store.allium's `ReducerConformance` guidance. A
# path dependency on an EXCLUDED workspace member (see this file's `exclude`
# above) is exactly what that exclusion is designed to still allow: this crate
# is still never built for wasm here, and `spacetime build` still ignores this
# Cargo.toml entirely. `optional` and gated behind `test-support` below —
# `MemoryReducerCaller` is test infra, so a plain `cargo build`/release binary
# has no reason to link `spacetimedb` and its dependency tree (which otherwise
# doubles up `rand`/`rand_core`/`rand_chacha` in Cargo.lock).
dispatch-spacetime-module = { path = "spacetime/module", optional = true }

[dev-dependencies]
insta = "1"
proptest = "1"
tower = { version = "0.4", features = ["util"] }
# Self-dependency with test-support on, so `tests/` targets can see
# `MockProcessRunner`. `cargo test` unifies this with the lib build; a plain
# `cargo build` does not, so the mock stays out of the release binary.
dispatch-tui = { path = ".", features = ["test-support"] }

[features]
# Exposes `MockProcessRunner` and the `ExitStatus` helpers to integration tests,
# and pulls in `dispatch-spacetime-module` so `MemoryReducerCaller` can reuse
# its pure helpers. Off in release builds; `cargo test` turns it on via the
# self dev-dependency above.
test-support = ["dep:dispatch-spacetime-module"]

# Task #16776: ~30 test binaries each linked with full DWARF made a one-file
# rebuild ~20s slower. Line tables keep file:line in panics and backtraces.
# See `DevBuildsKeepLineTablesNotFullDebugInfo` in docs/specs/dispatch.allium.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
# `tarpaulin` is set by cargo-tarpaulin; tests/common/spacetime_instance.rs
# skips live-instance tests under it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lints.clippy]
# Added by task #602 (2026-05-07): surfaces accidental panics in production paths
unwrap_used = "warn"
# Added by task #602 (2026-05-07): surfaces accidental panics in production paths
expect_used = "warn"

[[bin]]
name = "dispatch"
path = "src/main.rs"
